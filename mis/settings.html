<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  let B; try { B = await initShell('settings'); } catch (e) { return; }
  const main = $id('main');
  setTitle('Settings', 'App name, logo and theme');
  if (B.user.role !== 'admin') { main.innerHTML = '<div class="card empty">Only administrators can open this page.</div>'; return; }
  const br = Object.assign({ appName: '', tagline: '', org: '', loginTitle: '', loginText: '', footer: '', primary: '#4f46e5', sidebar: '#0f172a', mode: '', logo: '' }, B.brand);
  const PRI = ['#4f46e5', '#0284c7', '#059669', '#dc2626', '#d97706', '#7c3aed', '#db2777', '#0f766e'];
  const SID = ['#0f172a', '#111827', '#1e1b4b', '#064e3b', '#4c0519', '#1c1917', '#0c4a6e', '#312e81'];
  const sw = (id, list) => '<div class="sws">' + list.map(c => '<button type="button" class="sw" data-t="' + id + '" data-c="' + c + '" style="background:' + c + '"></button>').join('') + '<input type="color" id="' + id + '"></div>';

  main.innerHTML = '<form id="sf"><div class="card"><div class="bar"><h2>Application</h2></div><div class="grid3">' +
    '<div><label>App name *</label><input id="s_name" required maxlength="40"></div><div><label>Tagline (shown under the name)</label><input id="s_tag" maxlength="40"></div>' +
    '<div><label>Organisation name (login page)</label><input id="s_org" maxlength="80"></div><div><label>Footer text (login page)</label><input id="s_ft" maxlength="120"></div></div>' +
    '<label>Logo</label><div class="logobox"><img id="s_img" alt=""><div><input type="file" id="s_file" accept="image/*" style="margin:0 0 8px"><button type="button" class="btn g" id="s_rm">Remove logo</button></div></div>' +
    '<p class="mu" style="margin:0">Upload the logo here, or leave it empty and put a file named <b>logo.png</b> next to <b>login.html</b>. Square images on a transparent or white background work best.</p></div>' +
    '<div class="card"><div class="bar"><h2>Login page</h2></div><div class="grid3"><div><label>Heading</label><input id="s_lt" maxlength="60"></div><div><label>Message</label><input id="s_ltx" maxlength="200"></div></div></div>' +
    '<div class="card"><div class="bar"><h2>Theme</h2></div><div class="grid3"><div><label>Primary colour (buttons, links, highlights)</label>' + sw('s_pri', PRI) + '</div>' +
    '<div><label>Sidebar colour (choose a dark colour)</label>' + sw('s_sid', SID) + '</div><div><label>Default mode</label><select id="s_mode"><option value="">Follow the device</option><option value="light">Light</option><option value="dark">Dark</option></select></div></div>' +
    '<p class="mu" style="margin:0">Colour changes preview instantly. Each person can still switch light / dark with the &#127769; button.</p></div>' +
    '<div class="acts"><button class="btn" id="s_sv">Save settings</button></div></form>';

  const set = () => {
    $id('s_name').value = br.appName; $id('s_tag').value = br.tagline; $id('s_org').value = br.org; $id('s_ft').value = br.footer; $id('s_lt').value = br.loginTitle; $id('s_ltx').value = br.loginText;
    $id('s_pri').value = br.primary; $id('s_sid').value = br.sidebar; $id('s_mode').value = br.mode; logoShow();
  };
  const PHS = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#e2e8f0"/><path d="M32 12 10 24h44L32 12Zm-18 14v22h6V26h-6Zm10 0v22h6V26h-6Zm10 0v22h6V26h-6Zm10 0v22h6V26h-6ZM10 50v4h44v-4H10Z" fill="#64748b"/></svg>');
  function logoShow() { $id('s_img').src = br.logo || PHS; $id('s_rm').style.display = br.logo ? '' : 'none'; }
  const live = () => { br.primary = $id('s_pri').value; br.sidebar = $id('s_sid').value; applyBrand(br); };
  main.querySelectorAll('.sw').forEach(b => b.onclick = () => { $id(b.dataset.t).value = b.dataset.c; live(); });
  $id('s_pri').oninput = live; $id('s_sid').oninput = live;
  $id('s_rm').onclick = () => { br.logo = ''; logoShow(); };

  const toLogo = (file, max) => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k)); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/png')); }; img.onerror = () => rej(new Error('Could not read that image')); img.src = r.result; };
    r.onerror = () => rej(new Error('Could not read that file')); r.readAsDataURL(file);
  });
  $id('s_file').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { let out = ''; for (const max of [220, 160, 110, 80]) { out = await toLogo(f, max); if (out.length < 34000) break; } if (out.length >= 34000) throw new Error('That image is too detailed. Try a simpler or smaller logo.'); br.logo = out; logoShow(); } catch (err) { fail(err); }
  };
  $id('sf').onsubmit = async e => {
    e.preventDefault(); const b = $id('s_sv'); b.disabled = true; b.textContent = 'Saving...';
    Object.assign(br, { appName: $id('s_name').value.trim(), tagline: $id('s_tag').value.trim(), org: $id('s_org').value.trim(), footer: $id('s_ft').value.trim(), loginTitle: $id('s_lt').value.trim(), loginText: $id('s_ltx').value.trim(), primary: $id('s_pri').value, sidebar: $id('s_sid').value, mode: $id('s_mode').value });
    try { await post({ mode: 'settingsSave', brand: JSON.stringify(br) }); const nb = await freshBoot(); renderSide(nb, 'settings'); setTitle('Settings', 'App name, logo and theme'); toast('Settings saved'); }
    catch (err) { fail(err); }
    b.disabled = false; b.textContent = 'Save settings';
  };
  set();
})();
</script>
</body>
</html>
