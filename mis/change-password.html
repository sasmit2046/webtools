<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
<style>.fm{max-width:460px}.msg{min-height:22px;margin-bottom:12px;font-weight:700}.msg.err{color:#dc2626}.msg.ok{color:#15803d}.fm .btn{width:100%}</style>
</head>
<body>
<main id="main">
  <div class="card">
    <form id="f" class="fm">
      <h2 style="margin-bottom:4px">Update your password</h2>
      <p class="mu" style="margin:0 0 20px">Enter your current password, then choose a new one (at least 6 characters).</p>
      <label for="cur">Current password</label>
      <input id="cur" type="password" autocomplete="current-password" required>
      <label for="nw">New password</label>
      <input id="nw" type="password" autocomplete="new-password" minlength="6" required>
      <label for="cf">Confirm new password</label>
      <input id="cf" type="password" autocomplete="new-password" minlength="6" required>
      <label class="chk"><input type="checkbox" id="show"> Show passwords</label>
      <div class="msg" id="msg"></div>
      <button class="btn" id="go">Change password</button>
    </form>
  </div>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  try { await initShell('password'); } catch (e) { return; }
  setTitle('Change Password', 'Keep your account secure');
  $id('show').onchange = e => ['cur', 'nw', 'cf'].forEach(id => $id(id).type = e.target.checked ? 'text' : 'password');
  const msg = $id('msg'), go = $id('go');
  const say = (t, ok) => { msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); };
  $id('f').addEventListener('submit', async e => {
    e.preventDefault();
    const cur = $id('cur').value, nw = $id('nw').value, cf = $id('cf').value;
    if (nw.length < 6) return say('New password must be at least 6 characters.');
    if (nw !== cf) return say('New password and confirmation do not match.');
    if (nw === cur) return say('New password must be different from the current one.');
    say(''); go.disabled = true; go.textContent = 'Saving...';
    try { await post({ mode: 'changepw', current: cur, newpw: nw }); e.target.reset(); say('Password changed successfully.', true); }
    catch (ex) { say(errMsg(ex)); }
    finally { go.disabled = false; go.textContent = 'Change password'; }
  });
})();
</script>
</body>
</html>
