<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roles & Access</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  let B; try { B = await initShell('roles'); } catch (e) { return; }
  const main = $id('main'); let D, sel;
  setTitle('Roles & Access', 'Choose what each role can do in every module');
  if (B.user.role !== 'admin') { main.innerHTML = '<div class="card empty">Only administrators can open this page.</div>'; return; }

  async function load(keep) {
    try { D = await get({ action: 'roles' }); } catch (e) { fail(e); return; }
    if (!keep || !D.roles.some(r => r.role === sel)) sel = D.roles.length ? D.roles[0].role : '';
    draw();
  }
  function draw() {
    const cur = D.roles.find(r => r.role === sel) || { perms: {} }, full = sel === 'admin';
    main.innerHTML = '<div class="grid2"><div class="card"><div class="bar"><h2>Roles</h2></div>' +
      D.roles.map(r => '<button class="rb' + (r.role === sel ? ' on' : '') + '" data-r="' + H(r.role) + '">&#128737; ' + H(r.role) + '</button>').join('') +
      '<div class="bar" style="margin:14px 0 0"><input id="nr" placeholder="New role name" style="margin:0;flex:1"><button class="btn" id="ar">Add</button></div></div>' +
      '<div class="card"><div class="bar"><h2>Permissions: <span class="pill">' + H(sel) + '</span></h2><span class="sp"></span>' + (full ? '' : '<button class="btn dng" id="dr">Delete role</button><button class="btn" id="sv">Save permissions</button>') + '</div>' +
      (full ? '<p class="mu">Administrators always have full access to every module and to all administration pages.</p>' :
        '<div class="tw"><table class="tbl"><tr><th>Module</th><th class="ta">View</th><th class="ta">Create</th><th class="ta">Edit</th><th class="ta">Delete</th></tr>' +
        D.modules.map(m => '<tr><td>' + H(m.icon + ' ' + m.name) + '</td>' + 'vced'.split('').map(a => '<td class="ta"><input type="checkbox" class="pc" data-m="' + H(m.slug) + '" data-a="' + a + '"' + (String((cur.perms || {})[m.slug] || '').indexOf(a) >= 0 ? ' checked' : '') + '></td>').join('') + '</tr>').join('') +
        '</table></div><p class="mu" style="margin-bottom:0">Create, Edit and Delete are only useful together with View.</p>') + '</div></div>';
    main.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { sel = b.dataset.r; draw(); });
    $id('ar').onclick = async () => {
      const n = $id('nr').value.trim(); if (!n) return;
      try { const j = await post({ mode: 'roleSave', role: n, perms: '{}' }); sel = j.role; toast('Role added'); load(true); } catch (e) { fail(e); }
    };
    if (full) return;
    $id('sv').onclick = async () => {
      const p = {}; main.querySelectorAll('.pc:checked').forEach(c => { p[c.dataset.m] = (p[c.dataset.m] || '') + c.dataset.a; });
      Object.keys(p).forEach(k => { if (p[k].indexOf('v') < 0) p[k] = 'v' + p[k]; });
      try { await post({ mode: 'roleSave', role: sel, perms: JSON.stringify(p) }); toast('Permissions saved'); load(true); } catch (e) { fail(e); }
    };
    $id('dr').onclick = () => confirmBox('Delete role?', 'The role "' + sel + '" will be removed. Roles that are assigned to users cannot be deleted.', 'Delete role', async () => {
      try { await post({ mode: 'roleDelete', role: sel }); toast('Role deleted'); load(); } catch (e) { fail(e); }
    });
  }
  load();
})();
</script>
</body>
</html>
