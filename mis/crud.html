<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Records</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="https://cdn.datatables.net/1.11.5/css/jquery.dataTables.min.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdn.datatables.net/1.11.5/js/jquery.dataTables.min.js"></script>
<script>
(async () => {
  const slug = new URLSearchParams(location.search).get('m') || 'contacts';
  let B; try { B = await initShell('m:' + slug); } catch (e) { return; }
  const m = B.modules.find(x => x.slug === slug), main = $id('main');
  if (!m) { setTitle('Not found'); main.innerHTML = '<div class="card empty">This module does not exist or you do not have access to it.</div>'; return; }
  setTitle(m.icon + ' ' + m.name, 'View and manage records');
  const can = a => m.can.indexOf(a) >= 0;
  const tabs = '<div class="tabs"><a class="tab on" href="#">&#128203; Records</a><a class="tab" href="#" data-go="mdash.html?m=' + encodeURIComponent(slug) + '">&#128202; Dashboard</a></div>';
  main.innerHTML = tabs + '<div class="card"><div class="bar"><h2>All Entries</h2><span class="sp"></span>' + (can('c') ? '<button class="btn" id="add">+ Add New</button>' : '') + '</div><div class="tw"><table id="tbl" class="display" style="width:100%"></table></div></div>';

  bindGo(main);
  const actions = () => '<button type="button" class="vbtn">&#128065; View</button>' + (can('e') ? ' <button type="button" class="ebtn">&#9998; Edit</button>' : '') + (can('d') ? ' <button type="button" class="dbtn">&#128465; Delete</button>' : '');
  const cols = [{ title: 'ID', data: 'ID', type: 'num' }]
    .concat(m.fields.map(f => ({ title: f.label, data: r => r[f.key] == null ? '' : r[f.key], render: (d, t) => { d = String(d); return t === 'display' ? H(d.length > 70 ? d.slice(0, 70) + '\u2026' : d) : d; } })))
    .concat([{ title: 'Action', data: null, orderable: false, searchable: false, className: 'ta', render: actions }]);
  const table = $('#tbl').DataTable({
    ajax: { url: scriptURL, data: () => ({ token: token, action: 'list', module: slug }),
      dataSrc: j => { if (j.result === 'error') { if (j.error === 'auth') logout(true); else toast(j.error, true); return []; } return j.data; } },
    order: [[0, 'desc']], pageLength: 10, columns: cols
  });
  const rowOf = el => table.row($(el).closest('tr')).data();
  $('#tbl').on('click', '.vbtn', function () { viewM(rowOf(this)); });
  $('#tbl').on('click', '.ebtn', function () { formM(rowOf(this)); });
  $('#tbl').on('click', '.dbtn', function () { delM(rowOf(this)); });
  if (can('c')) $id('add').onclick = () => formM();

  function showRow(id) {   // reload, jump to the page holding the record and highlight it
    table.search('');
    table.ajax.reload(function () {
      const all = table.rows({ order: 'current', search: 'applied' }).indexes().toArray();
      const pos = all.findIndex(i => String(table.row(i).data().ID) === String(id));
      if (pos < 0) { table.page(0).draw('page'); return; }
      table.page(Math.floor(pos / table.page.len())).draw('page');
      const node = table.row(all[pos]).node(); $(node).addClass('hl');
      node.scrollIntoView({ block: 'center', behavior: 'smooth' });
      setTimeout(() => $(node).removeClass('hl'), 3500);
    }, false);
  }

  function viewM(r) {
    const rows = [['ID', r.ID]].concat(m.fields.map(f => [f.label, r[f.key]]));
    if (r.Date) rows.push(['Date', fdate(r.Date)]);
    if (r['Created By']) rows.push(['Created by', r['Created By']]);
    const o = modal('<div class="mh"><h3>Entry Details</h3><button class="x" data-close>&times;</button></div><dl class="dl">' + rows.map(x => '<dt>' + H(x[0]) + '</dt><dd>' + H(x[1] === '' || x[1] == null ? '\u2014' : x[1]) + '</dd>').join('') + '</dl><div class="acts"><button class="btn g" data-close>Close</button>' + (can('e') ? '<button class="btn" id="ved">Edit</button>' : '') + '</div>');
    if (can('e')) o.querySelector('#ved').onclick = () => { o.remove(); formM(r); };
  }

  async function formM(rec) {
    const ed = !!rec, opts = await lookupOpts(m.fields);
    const o = modal('<form id="fm"><div class="mh"><h3>' + (ed ? 'Edit Entry' : 'Add New') + '</h3><button type="button" class="x" data-close>&times;</button></div>' + m.fields.map((f, i) => fld(f, i, ed ? rec[f.key] : '', opts[f.key])).join('') + '<div class="acts"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" id="sv">' + (ed ? 'Update' : 'Save') + '</button></div></form>');
    bindMsgs(o.querySelector('#fm'), m.fields);
    const first = o.querySelector('[data-i]'); if (first) first.focus();
    o.querySelector('#fm').onsubmit = async e => {
      e.preventDefault(); const b = o.querySelector('#sv'); b.disabled = true; b.textContent = 'Saving...';
      try {
        const j = await post({ mode: ed ? 'update' : 'add', module: slug, ID: ed ? rec.ID : '', rec: JSON.stringify(readForm(e.target, m.fields)) });
        o.remove(); toast(ed ? 'Updated successfully!' : 'Saved successfully!'); showRow(j.id);
      } catch (err) { fail(err); b.disabled = false; b.textContent = ed ? 'Update' : 'Save'; }
    };
  }

  function delM(r) {
    confirmBox('Delete entry?', 'This will permanently remove #' + r.ID + ' from the sheet. This cannot be undone.', 'Delete', async () => {
      try { await post({ mode: 'delete', module: slug, ID: r.ID }); toast('Deleted successfully!'); table.ajax.reload(null, false); } catch (err) { fail(err); }
    });
  }
})();
</script>
</body>
</html>
