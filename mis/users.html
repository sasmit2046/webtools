<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  let B; try { B = await initShell('users'); } catch (e) { return; }
  const main = $id('main'); let D;
  setTitle('Users', 'Create accounts and assign roles');
  if (B.user.role !== 'admin') { main.innerHTML = '<div class="card empty">Only administrators can open this page.</div>'; return; }
  const me = B.user.username.toLowerCase();

  async function load() { try { D = await get({ action: 'users' }); } catch (e) { fail(e); return; } draw(); }
  function draw() {
    main.innerHTML = '<div class="card"><div class="bar"><h2>All users (' + D.users.length + ')</h2><span class="sp"></span><button class="btn" id="add">+ Add User</button></div><div class="tw"><table class="tbl"><tr><th>Username</th><th>Name</th><th>Role</th><th class="ta">Action</th></tr>' +
      D.users.map((u, i) => '<tr><td><b>' + H(u.username) + '</b>' + (u.username.toLowerCase() === me ? ' <span class="pill">You</span>' : '') + '</td><td>' + H(u.name) + '</td><td><span class="pill">' + H(u.role) + '</span></td><td class="ta"><button class="ebtn" data-e="' + i + '">&#9998; Edit</button>' +
        (u.username.toLowerCase() === me ? '' : ' <button class="dbtn" data-d="' + i + '">&#128465; Delete</button>') + '</td></tr>').join('') + '</table></div></div>';
    $id('add').onclick = () => form();
    main.querySelectorAll('[data-e]').forEach(b => b.onclick = () => form(D.users[b.dataset.e]));
    main.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const u = D.users[b.dataset.d];
      confirmBox('Delete user?', 'The account "' + u.username + '" will be removed and can no longer sign in.', 'Delete user', async () => {
        try { await post({ mode: 'userDelete', username: u.username }); toast('User deleted'); load(); } catch (e) { fail(e); }
      });
    });
  }
  function form(u) {
    const ed = !!u, self = ed && u.username.toLowerCase() === me;
    const o = modal('<form id="uf"><div class="mh"><h3>' + (ed ? 'Edit user' : 'Add user') + '</h3><button type="button" class="x" data-close>&times;</button></div>' +
      '<label>Username *</label><input id="un" value="' + H(ed ? u.username : '') + '" required' + (self ? ' readonly' : '') + ' autocomplete="off">' +
      '<label>Full name</label><input id="nm" value="' + H(ed ? u.name : '') + '">' +
      '<label>Role *</label><select id="rl"' + (self ? ' disabled' : '') + '>' + D.roles.map(r => '<option' + (ed && u.role === r ? ' selected' : '') + '>' + H(r) + '</option>').join('') + '</select>' +
      '<label>' + (ed ? 'New password (leave blank to keep the current one)' : 'Password * (min 6 characters)') + '</label><input id="pw" type="password" autocomplete="new-password"' + (ed ? '' : ' required minlength="6"') + '>' +
      '<div class="acts"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" id="sv">' + (ed ? 'Update' : 'Create user') + '</button></div></form>');
    o.querySelector('#uf').onsubmit = async e => {
      e.preventDefault(); const b = o.querySelector('#sv'); b.disabled = true;
      try { await post({ mode: 'userSave', orig: ed ? u.username : '', username: o.querySelector('#un').value, name: o.querySelector('#nm').value, role: o.querySelector('#rl').value, password: o.querySelector('#pw').value }); o.remove(); toast('User saved'); load(); }
      catch (err) { fail(err); b.disabled = false; }
    };
  }
  load();
})();
</script>
</body>
</html>
