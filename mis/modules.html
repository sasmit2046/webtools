<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module Builder</title>
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<main id="main"></main>
<script src="config.js"></script>
<script src="app.js"></script>
<script>
(async () => {
  let B; try { B = await initShell('modules'); } catch (e) { return; }
  const main = $id('main'), FT = ['text', 'number', 'email', 'date', 'textarea', 'select', 'lookup', 'checkbox'];
  const SWATCH = ['#6366f1', '#0ea5e9', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6', '#14b8a6', '#ef4444'];
  setTitle('Module Builder', 'Create unlimited CRUD modules without writing code');
  if (B.user.role !== 'admin') { main.innerHTML = '<div class="card empty">Only administrators can open this page.</div>'; return; }

  async function reload() { try { B = await freshBoot(); renderSide(B, 'modules'); } catch (e) { fail(e); } draw(); }
  function draw() {
    main.innerHTML = '<div class="card"><div class="bar"><h2>Modules (' + B.modules.length + ')</h2><span class="sp"></span><button class="btn" id="nw">+ New Module</button></div><div class="tw"><table class="tbl"><tr><th>Module</th><th>Fields</th><th>Type</th><th class="ta">Action</th></tr>' +
      B.modules.map((m, i) => '<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;background:' + H(mcolor(m, i)) + '"></span><b>' + H(m.icon + ' ' + m.name) + '</b></td><td>' + m.fields.map(f => H(f.label)).join(', ') + '</td><td>' + (m.builtin ? '<span class="pill">Built-in</span>' : 'Custom') + '</td><td class="ta">' +
        (m.builtin ? '' : '<button class="ebtn" data-e="' + i + '">&#9998; Edit</button> <button class="dbtn" data-d="' + i + '">&#128465; Delete</button>') + '</td></tr>').join('') + '</table></div></div>' +
      '<div class="card"><b>Tips</b><ul class="mu" style="margin:8px 0 0;padding-left:20px"><li>Each module gets its own tab in your Google Sheet, its own colour in the sidebar, and its own dashboard with widgets.</li><li>Use the <b>lookup</b> field type to fill a dropdown from another module\'s records (for example Department).</li><li>After creating a module, open <b>Roles &amp; Access</b> to choose who can view, create, edit or delete its records.</li></ul></div>';
    $id('nw').onclick = () => mb();
    main.querySelectorAll('[data-e]').forEach(b => b.onclick = () => mb(B.modules[b.dataset.e]));
    main.querySelectorAll('[data-d]').forEach(b => b.onclick = () => {
      const m = B.modules[b.dataset.d];
      confirmBox('Delete module?', 'This deletes "' + m.name + '" and ALL of its records permanently.', 'Delete module', async () => {
        try { await post({ mode: 'modDelete', id: m.id }); toast('Module deleted'); reload(); } catch (e) { fail(e); }
      });
    });
  }

  function mb(m) {
    m = m || { name: '', icon: '\uD83D\uDCC4', color: SWATCH[B.modules.length % SWATCH.length], fields: [{ label: '', type: 'text' }] };
    const refs = B.modules.filter(x => x.slug !== m.slug);
    const fr = f => {
      const t = f.type || 'text';
      return '<tr class="fr" data-k="' + H(f.key || '') + '" data-show="' + H(f.show || '') + '"><td><input class="fl" placeholder="Field label" value="' + H(f.label) + '" style="margin:0"></td>' +
        '<td><select class="ft" style="margin:0">' + FT.map(x => '<option value="' + x + '"' + (x === t ? ' selected' : '') + '>' + (x === 'lookup' ? 'lookup (other module)' : x) + '</option>').join('') + '</select></td>' +
        '<td><input class="fo" placeholder="opt1, opt2" value="' + H(f.options) + '" style="margin:0;min-width:150px;display:' + (t === 'select' ? 'block' : 'none') + '">' +
        '<div class="lk" style="gap:6px;display:' + (t === 'lookup' ? 'flex' : 'none') + '"><select class="lr" style="margin:0">' + refs.map(r => '<option value="' + H(r.slug) + '"' + (r.slug === f.ref ? ' selected' : '') + '>' + H(r.name) + '</option>').join('') + '</select><select class="ls" style="margin:0"></select></div>' +
        '<span class="nx mu" style="display:' + (t === 'select' || t === 'lookup' ? 'none' : 'inline') + '">&mdash;</span></td>' +
        '<td class="ta"><input type="checkbox" class="fq pc"' + (f.required ? ' checked' : '') + '></td>' +
        '<td><input class="fg" placeholder="Custom message when empty (optional)" value="' + H(f.msg) + '"' + (f.required ? '' : ' disabled') + ' style="margin:0;min-width:200px"></td>' +
        '<td class="ta"><button type="button" class="dbtn" onclick="this.closest(\'tr\').remove()">&#10005;</button></td></tr>';
    };
    const o = modal('<form id="mf"><div class="mh"><h3>' + (m.id ? 'Edit' : 'New') + ' module</h3><button type="button" class="x" data-close>&times;</button></div>' +
      '<div style="display:flex;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><label>Module name *</label><input id="mn" value="' + H(m.name) + '" required></div><div style="width:90px"><label>Icon</label><input id="mi" value="' + H(m.icon) + '"></div></div>' +
      '<label>Colour (used in the sidebar and dashboards)</label><div class="sws">' + SWATCH.map(c => '<button type="button" class="sw" data-c="' + c + '" style="background:' + c + '"></button>').join('') + '<input type="color" id="mc" value="' + H(m.color || SWATCH[0]) + '"></div>' +
      '<label>Fields. For <b>select</b> list the options separated by commas; for <b>lookup</b> choose the module and the field to show. Tick Required and, if you like, write the message users see when the field is empty.</label>' +
      '<div class="tw"><table class="tbl" id="ftb"><tr><th>Label</th><th>Type</th><th>Options / Source</th><th class="ta">Required</th><th>Required message</th><th></th></tr>' + m.fields.map(fr).join('') + '</table></div>' +
      '<button type="button" class="btn g" id="af" style="margin:10px 0 18px">+ Add field</button><div class="acts"><button type="button" class="btn g" data-close>Cancel</button><button class="btn" id="sv">Save module</button></div></form>', true);

    const fillShow = tr => {
      const ref = refs.find(r => r.slug === tr.querySelector('.lr').value), ls = tr.querySelector('.ls'), keep = tr.dataset.show;
      ls.innerHTML = ref ? ref.fields.map(x => '<option value="' + H(x.key) + '"' + (x.key === keep ? ' selected' : '') + '>' + H(x.label) + '</option>').join('') : '';
    };
    const sync = tr => {
      const t = tr.querySelector('.ft').value;
      tr.querySelector('.fo').style.display = t === 'select' ? 'block' : 'none';
      tr.querySelector('.lk').style.display = t === 'lookup' ? 'flex' : 'none';
      tr.querySelector('.nx').style.display = t === 'select' || t === 'lookup' ? 'none' : 'inline';
      if (t === 'lookup') fillShow(tr);
    };
    o.querySelectorAll('.fr').forEach(tr => fillShow(tr));
    o.querySelector('#ftb').addEventListener('change', e => {
      const tr = e.target.closest('tr'); if (!tr) return;
      if (e.target.classList.contains('ft')) sync(tr);
      if (e.target.classList.contains('lr')) { tr.dataset.show = ''; fillShow(tr); }
      if (e.target.classList.contains('fq')) tr.querySelector('.fg').disabled = !e.target.checked;   // message only for required fields
    });
    o.querySelectorAll('.sw').forEach(b => b.onclick = () => { o.querySelector('#mc').value = b.dataset.c; });
    o.querySelector('#af').onclick = () => o.querySelector('#ftb tbody').insertAdjacentHTML('beforeend', fr({ label: '', type: 'text' }));
    o.querySelector('#mf').onsubmit = async e => {
      e.preventDefault(); const b = o.querySelector('#sv'); b.disabled = true; b.textContent = 'Saving...';
      const fields = [...o.querySelectorAll('.fr')].map(t => ({ key: t.dataset.k, label: t.querySelector('.fl').value, type: t.querySelector('.ft').value, options: t.querySelector('.fo').value,
        required: t.querySelector('.fq').checked, msg: t.querySelector('.fg').value.trim(), ref: t.querySelector('.lr').value, show: t.querySelector('.ls').value }));
      try { await post({ mode: 'modSave', id: m.id || '', name: o.querySelector('#mn').value, icon: o.querySelector('#mi').value, color: o.querySelector('#mc').value, fields: JSON.stringify(fields) }); o.remove(); toast('Module saved'); reload(); }
      catch (err) { fail(err); b.disabled = false; b.textContent = 'Save module'; }
    };
  }
  draw();
})();
</script>
</body>
</html>
